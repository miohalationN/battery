name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      # 纯文档改动不触发编译（需要时可用 workflow_dispatch 手动触发）
      - '**.md'
      - 'conf.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 列出可用 Xcode 版本，选择最新稳定版
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version
          swift --version

      - name: Build app + helper
        run: bash build-app.sh

      - name: Run tests
        run: swift test 2>&1 || echo "::warning::部分测试失败，不阻断打包"

      - name: Package artifact
        run: |
          cd .build/debug
          ditto -c -k --sequesterRsrc --keepParent BatteryBar.app BatteryBar.zip

      - name: Upload BatteryBar.app
        uses: actions/upload-artifact@v4
        with:
          name: BatteryBar
          path: .build/debug/BatteryBar.zip
          retention-days: 30
